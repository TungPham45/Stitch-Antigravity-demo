<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create New Flashcard Set - LinguaFlash</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2020ee",
                        "primary-dark": "#1e1eae",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101022",
                        "onyx": "#111118",
                        "slate-muted": "#616189",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Lexend', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-onyx dark:text-slate-100 min-h-screen">
    <header
        class="sticky top-0 z-50 w-full bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-primary text-white p-2 rounded-lg">
                    <span class="material-symbols-outlined block">auto_stories</span>
                </div>
                <a href="index.html"
                    class="text-2xl font-black tracking-tight text-onyx dark:text-white leading-none">LinguaFlash</a>
            </div>
            <nav class="hidden md:flex items-center gap-10">
                <a class="text-slate-muted hover:text-primary font-medium transition-colors"
                    href="index.html">Explore</a>
                <a class="text-slate-muted hover:text-primary font-medium transition-colors" href="study.html">Study
                    Modes</a>
                <a class="text-slate-muted hover:text-primary font-medium transition-colors"
                    href="library.html">Library</a>
            </nav>
            <div class="flex items-center gap-4">
                <div
                    class="size-10 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20">
                    <span class="material-symbols-outlined text-primary">person</span>
                </div>
            </div>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="library.html" class="p-2 hover:bg-primary/10 rounded-full transition-colors group">
                    <span
                        class="material-symbols-outlined text-onyx dark:text-slate-100 group-hover:text-primary">arrow_back</span>
                </a>
                <h2 class="text-3xl font-black text-onyx dark:text-slate-100 tracking-tight">Create New Flashcard Set
                </h2>
            </div>
        </div>
        <section class="space-y-8">
            <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-primary/5 shadow-sm space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Set Title</label>
                        <input
                            class="w-full px-4 py-3 rounded-xl border border-primary/10 bg-background-light dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400"
                            placeholder="Enter set name..." type="text" />
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Category</label>
                        <select
                            class="w-full px-4 py-3 rounded-xl border border-primary/10 bg-background-light dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                            <option>Academic</option>
                            <option>Business</option>
                            <option>Travel</option>
                            <option>Medical</option>
                            <option>General</option>
                        </select>
                    </div>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Optional
                        Description</label>
                    <textarea
                        class="w-full px-4 py-3 rounded-xl border border-primary/10 bg-background-light dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400 resize-none"
                        placeholder="Describe what this set is about..." rows="3"></textarea>
                </div>
            </div>
            <div class="space-y-6">
                <div class="flex items-center justify-between px-2">
                    <h3 class="text-xl font-bold text-onyx dark:text-slate-100">Add Your Words</h3>
                    <span class="text-sm font-medium text-slate-muted">5 Cards</span>
                </div>
                <div
                    class="group bg-white dark:bg-slate-900 p-6 rounded-2xl border border-primary/5 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-none text-slate-400 font-bold text-lg w-6">1</div>
                    <div class="flex-1 w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300 font-medium"
                            placeholder="Term" type="text" value="Pioneer" /></div>
                    <div class="flex-[2] w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300"
                            placeholder="Definition" type="text"
                            value="A person who is among the first to explore or settle a new country or area." /></div>
                    <button
                        class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-full transition-all"><span
                            class="material-symbols-outlined">delete</span></button>
                </div>
                <div
                    class="group bg-white dark:bg-slate-900 p-6 rounded-2xl border border-primary/5 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-none text-slate-400 font-bold text-lg w-6">2</div>
                    <div class="flex-1 w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300 font-medium"
                            placeholder="Term" type="text" value="Resilient" /></div>
                    <div class="flex-[2] w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300"
                            placeholder="Definition" type="text"
                            value="Able to withstand or recover quickly from difficult conditions." /></div>
                    <button
                        class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-full transition-all"><span
                            class="material-symbols-outlined">delete</span></button>
                </div>
                <div
                    class="group bg-white dark:bg-slate-900 p-6 rounded-2xl border border-primary/5 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-none text-slate-400 font-bold text-lg w-6">3</div>
                    <div class="flex-1 w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300 font-medium"
                            placeholder="Term" type="text" value="Eloquent" /></div>
                    <div class="flex-[2] w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300"
                            placeholder="Definition" type="text" value="Fluent or persuasive in speaking or writing." />
                    </div>
                    <button
                        class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-full transition-all"><span
                            class="material-symbols-outlined">delete</span></button>
                </div>
                <div
                    class="group bg-white dark:bg-slate-900 p-6 rounded-2xl border border-primary/5 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-none text-slate-400 font-bold text-lg w-6">4</div>
                    <div class="flex-1 w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300 font-medium"
                            placeholder="Term" type="text" value="Ambiguous" /></div>
                    <div class="flex-[2] w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300"
                            placeholder="Definition" type="text"
                            value="Open to more than one interpretation; not having one obvious meaning." /></div>
                    <button
                        class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-full transition-all"><span
                            class="material-symbols-outlined">delete</span></button>
                </div>
                <div
                    class="group bg-white dark:bg-slate-900 p-6 rounded-2xl border border-primary/5 shadow-sm flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-none text-slate-400 font-bold text-lg w-6">5</div>
                    <div class="flex-1 w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300 font-medium"
                            placeholder="Term" type="text" value="Tenacious" /></div>
                    <div class="flex-[2] w-full"><input
                            class="w-full bg-transparent border-0 border-b-2 border-primary/10 focus:border-primary focus:ring-0 px-0 py-2 placeholder:text-slate-300"
                            placeholder="Definition" type="text"
                            value="Tending to keep a firm hold of something; clinging or adhering closely." /></div>
                    <button
                        class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-full transition-all"><span
                            class="material-symbols-outlined">delete</span></button>
                </div>
                <button
                    class="w-full py-6 border-2 border-dashed border-primary/20 rounded-2xl text-primary font-bold flex items-center justify-center gap-2 hover:bg-primary/5 transition-all">
                    <span class="material-symbols-outlined">add_circle</span>
                    Add Another Card
                </button>
            </div>
            <div class="flex flex-col sm:flex-row items-center justify-end gap-4 pt-8 border-t border-primary/10">
                <a href="library.html"
                    class="w-full sm:w-auto px-10 py-4 rounded-full border-2 border-primary/20 text-slate-muted font-bold hover:bg-primary/5 transition-all text-center">Cancel</a>
                <button
                    class="w-full sm:w-auto px-12 py-4 rounded-full bg-primary text-white font-bold shadow-lg shadow-primary/25 hover:shadow-primary/40 hover:-translate-y-0.5 active:translate-y-0 transition-all">Save
                    Set</button>
            </div>
        </section>
    </main>
    <footer class="bg-white dark:bg-background-dark border-t border-primary/5 px-6 md:px-20 lg:px-40 py-12">
        <div class="max-w-[1280px] mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center gap-8">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center size-8 bg-primary/10 rounded-lg text-primary"><span
                            class="material-symbols-outlined text-xl">style</span></div>
                    <h2 class="text-onyx dark:text-white text-lg font-bold">LinguaFlash</h2>
                </div>
                <div class="flex flex-wrap justify-center gap-8">
                    <a class="text-slate-muted text-sm font-medium hover:text-primary transition-colors"
                        href="#">About</a>
                    <a class="text-slate-muted text-sm font-medium hover:text-primary transition-colors"
                        href="#">Privacy</a>
                    <a class="text-slate-muted text-sm font-medium hover:text-primary transition-colors"
                        href="#">Terms</a>
                    <a class="text-slate-muted text-sm font-medium hover:text-primary transition-colors"
                        href="#">Contact</a>
                </div>
            </div>
            <div class="mt-12 pt-8 border-t border-primary/5 text-center">
                <p class="text-slate-muted text-sm">© 2024 LinguaFlash. Built for academic excellence.</p>
            </div>
        </div>
    </footer>
</body>

</html>
